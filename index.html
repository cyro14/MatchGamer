<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GameMatch</title>
  <!-- Tailwind CSS via CDN para manter o mesmo visual -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons para os ícones -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    body {
      overflow: hidden;
      touch-action: none; /* Evita que a tela role no celular enquanto arrasta o card */
    }
    
    .card {
      position: absolute;
      width: 100%;
      max-width: 24rem; /* max-w-sm */
      height: 70vh;
      background-color: #1f2937; /* gray-800 */
      border-radius: 1.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      transform-origin: 50% 100%;
      will-change: transform;
      cursor: grab;
    }

    .card:active {
      cursor: grabbing;
    }

    .game-bg {
      width: 100%;
      height: 66.66%;
      background-size: cover;
      background-position: center;
    }

    .gradient-overlay {
      width: 100%;
      height: 100%;
      background: linear-gradient(to top, #111827 0%, transparent 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 1.5rem;
    }
  </style>
</head>
<body class="bg-gray-900 text-white flex flex-col h-screen">

  <!-- Header -->
  <header class="flex justify-between items-center p-4">
    <i class="ph-fill ph-game-controller text-pink-500 text-3xl"></i>
    <h1 class="text-xl font-bold tracking-wider">GameMatch</h1>
    <i class="ph ph-user text-gray-400 text-2xl"></i>
  </header>

  <!-- Main Area (Onde os cards vão aparecer) -->
  <main id="card-container" class="flex-1 relative flex items-center justify-center p-4">
    <div id="loading" class="text-gray-400 font-semibold animate-pulse">Buscando jogos...</div>
  </main>

  <!-- Botões de Ação Fixos -->
  <div class="flex justify-center gap-6 mb-4 z-10">
    <button onclick="triggerSwipe('left')" class="p-4 bg-gray-800 border border-red-500 text-red-500 rounded-full hover:bg-red-500 hover:text-white transition">
      <i class="ph-bold ph-x text-2xl"></i>
    </button>
    <button class="p-4 bg-gray-800 border border-blue-400 text-blue-400 rounded-full hover:bg-blue-400 hover:text-white transition">
      <i class="ph-bold ph-star text-2xl"></i>
    </button>
    <button onclick="triggerSwipe('right')" class="p-4 bg-gray-800 border border-green-500 text-green-500 rounded-full hover:bg-green-500 hover:text-white transition">
      <i class="ph-bold ph-heart text-2xl"></i>
    </button>
  </div>

  <!-- Bottom Nav -->
  <nav class="flex justify-around p-4 border-t border-gray-800 bg-gray-900 z-10">
    <i class="ph-fill ph-game-controller text-pink-500 text-2xl"></i>
    <i class="ph-bold ph-magnifying-glass text-gray-500 text-2xl"></i>
    <i class="ph-bold ph-heart text-gray-500 text-2xl"></i>
  </nav>

  <script>
    const API_KEY = 'ae08037aa9fb40a48b12090819cedb07';
    let games = [];
    let currentIndex = 0;
    const container = document.getElementById('card-container');
    const loadingText = document.getElementById('loading');
    
    // Variáveis para a física do swipe
    let currentCard = null;
    let startX = 0;
    let currentTranslateX = 0;

    // Busca os dados na API
    async function fetchGames() {
      try {
        const response = await fetch(`https://api.rawg.io/api/games?key=${API_KEY}&page_size=10&ordering=-rating`);
        const data = await response.json();
        games = data.results;
        loadingText.style.display = 'none';
        renderCard();
      } catch (error) {
        loadingText.innerText = "Erro ao carregar jogos.";
      }
    }

    // Cria e exibe o card atual na tela
    function renderCard() {
      if (currentIndex >= games.length) {
        container.innerHTML = `<div class="text-gray-400 font-semibold">Você viu todos os jogos de hoje!</div>`;
        return;
      }

      const game = games[currentIndex];
      const genresHTML = game.genres.slice(0, 3).map(g => 
        `<span class="text-xs bg-gray-700 bg-opacity-80 px-2 py-1 rounded-full">${g.name}</span>`
      ).join('');

      const cardHTML = `
        <div id="active-card" class="card">
          <div class="game-bg" style="background-image: url('${game.background_image}')">
            <div class="gradient-overlay">
              <h2 class="text-3xl font-bold mb-1 drop-shadow-md text-white">${game.name}</h2>
              <p class="text-green-400 font-semibold mb-2 drop-shadow-md">94% compatível</p>
              <div class="flex flex-wrap gap-2">
                ${genresHTML}
              </div>
            </div>
          </div>
          <div class="p-6 h-1/3 flex flex-col bg-gray-800">
            <p class="text-sm text-gray-300">
              Deslize para a direita se quiser jogar. O algoritmo considera seu gosto por RPG e Aventura.
            </p>
          </div>
        </div>
      `;

      container.innerHTML = cardHTML;
      currentCard = document.getElementById('active-card');
      initDragEvents(currentCard);
    }

    // Lógica Matemática de Arrastar (Vanilla JS)
    function initDragEvents(card) {
      card.addEventListener('pointerdown', (e) => {
        startX = e.clientX;
        card.style.transition = 'none'; // Remove transição suave para grudar no mouse
        card.setPointerCapture(e.pointerId);
      });

      card.addEventListener('pointermove', (e) => {
        if (!startX) return;
        currentTranslateX = e.clientX - startX;
        // Calcula uma leve rotação baseada no eixo X (física simples)
        const rotate = currentTranslateX * 0.05; 
        card.style.transform = `translateX(${currentTranslateX}px) rotate(${rotate}deg)`;
      });

      card.addEventListener('pointerup', (e) => {
        if (!startX) return;
        startX = 0;
        card.style.transition = 'transform 0.3s ease-out'; // Volta a transição suave
        
        // Verifica se arrastou o suficiente para rejeitar ou dar match
        if (currentTranslateX > 120) {
          swipeOut('right');
        } else if (currentTranslateX < -120) {
          swipeOut('left');
        } else {
          // Volta para o centro se não arrastou o suficiente
          card.style.transform = `translateX(0px) rotate(0deg)`;
        }
        currentTranslateX = 0;
      });
    }

    // Anima a saída do card e chama o próximo
    function swipeOut(direction) {
      if (!currentCard) return;
      const xOffset = direction === 'right' ? 1000 : -1000;
      const rotate = direction === 'right' ? 30 : -30;
      
      currentCard.style.transition = 'transform 0.4s ease-in';
      currentCard.style.transform = `translateX(${xOffset}px) rotate(${rotate}deg)`;
      
      // Espera a animação terminar antes de carregar o próximo card
      setTimeout(() => {
        currentIndex++;
        renderCard();
      }, 300);
    }

    // Função para os botões fixos acionarem o swipe
    function triggerSwipe(direction) {
      swipeOut(direction);
    }

    // Inicia o app
    fetchGames();
  </script>
</body>
</html>
